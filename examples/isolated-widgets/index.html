<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isolated Widgets Example</title>
  </head>
  <body data-example="isolated-widgets">
    <div id="app">
      <p>Each widget below is mounted from a separate markup container and keeps its own state.</p>
      <div data-react-from-markup-container>
        <section
          class="IsolatedCounter"
          data-rehydratable="IsolatedCounter"
          data-title="Email queue"
          data-count="2"
        >
          <h2>Email queue</h2>
          <p>Local count: 2</p>
          <button>Increment</button>
          <button>Reset</button>
        </section>
      </div>
      <div data-react-from-markup-container>
        <section
          class="IsolatedCounter"
          data-rehydratable="IsolatedCounter"
          data-title="Orders awaiting review"
          data-count="7"
        >
          <h2>Orders awaiting review</h2>
          <p>Local count: 7</p>
          <button>Increment</button>
          <button>Reset</button>
        </section>
      </div>
      <div data-react-from-markup-container>
        <section
          class="IsolatedCounter"
          data-rehydratable="IsolatedCounter"
          data-title="Support escalations"
          data-count="1"
        >
          <h2>Support escalations</h2>
          <p>Local count: 1</p>
          <button>Increment</button>
          <button>Reset</button>
        </section>
      </div>
    </div>
    <script type="module" src="../main.js"></script>
  </body>
</html>
