<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Automatic Batching Example</title>
  </head>
  <body data-example="automatic-batching">
    <div id="app">
      <div data-react-from-markup-container>
        <section
          class="AutomaticBatching"
          data-rehydratable="AutomaticBatching"
          data-heading="Automatic batching in async updates"
        >
          <h2>Automatic batching in async updates</h2>
          <button>Run async update</button>
          <p>Count: 0</p>
          <p>Status: idle</p>
          <p>Last update: never</p>
          <p>Render count: 1</p>
        </section>
      </div>
    </div>
    <script type="module" src="../main.js"></script>
  </body>
</html>
