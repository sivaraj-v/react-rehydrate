<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validated Form Example</title>
  </head>
  <body data-example="validated-form">
    <div id="app">
      <div data-react-from-markup-container>
        <section
          class="ContactForm"
          data-rehydratable="ContactForm"
          data-heading="Contact us"
        >
          <h2>Contact us</h2>
          <form>
            <div class="ContactForm-field">
              <label>Name</label>
              <input type="text" name="name" />
            </div>
            <div class="ContactForm-field">
              <label>Email</label>
              <input type="email" name="email" />
            </div>
            <div class="ContactForm-field">
              <label>Message</label>
              <textarea name="message" rows="4"></textarea>
            </div>
            <button type="submit">Send message</button>
          </form>
        </section>
      </div>
    </div>
    <script type="module" src="../main.js"></script>
  </body>
</html>
