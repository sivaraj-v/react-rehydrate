<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deferred Search Example</title>
  </head>
  <body data-example="deferred-search">
    <div id="app">
      <div data-react-from-markup-container>
        <section
          class="DeferredSearch"
          data-rehydratable="DeferredSearch"
          data-heading="Deferred catalog search"
        >
          <h2>Deferred catalog search</h2>
          <input type="search" placeholder="Search 1200 items" />
          <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
          </ul>
        </section>
      </div>
    </div>
    <script type="module" src="../main.js"></script>
  </body>
</html>
